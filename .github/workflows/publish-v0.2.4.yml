name: Publish BC3 MultiDetails v0.2.4

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'Publish v0.2.4 release'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release payload
        uses: actions/checkout@v4

      - name: Verify installer
        shell: bash
        run: |
          set -euo pipefail
          echo "9b08fe01d625fdfdcecf58b03ce51955742d45a51cd8637cad4b3b60a172631f  dist/BC3MultiDetails-Setup-0.2.4.exe" |
            sha256sum --check --strict

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v0.2.4 \
            "dist/BC3MultiDetails-Setup-0.2.4.exe#Windows 安装程序" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "BC3 MultiDetails v0.2.4" \
            --latest \
            --notes-file docs/RELEASE_NOTES_0.2.4.md

      - name: Remove temporary release payload
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          asset_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/dist/BC3MultiDetails-Setup-0.2.4.exe?ref=main" --jq '.sha')"
          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/contents/dist/BC3MultiDetails-Setup-0.2.4.exe" \
            -f message='Remove temporary v0.2.4 release payload' \
            -f sha="${asset_sha}" \
            -f branch=main

      - name: Remove one-time workflow
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          workflow_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/publish-v0.2.4.yml?ref=main" --jq '.sha')"
          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/publish-v0.2.4.yml" \
            -f message='Remove one-time v0.2.4 publisher' \
            -f sha="${workflow_sha}" \
            -f branch=main
