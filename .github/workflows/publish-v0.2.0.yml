name: Publish BC3 MultiDetails v0.2.0

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'Publish v0.2.0 release'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release payload
        uses: actions/checkout@v4

      - name: Verify installer
        shell: bash
        run: |
          set -euo pipefail
          echo "eb6cf8676ff79596ac797ed7587fdedd68c8645e75f7061c2dbbdb38aa8c8e7b  release-assets/BC3MultiDetails-Setup-0.2.0.exe" |
            sha256sum --check --strict

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          新增可交互的多行 Text Details 差异区。

          - 支持 Ctrl+单击选择不连续行，并以 L/R 条带显示所选行
          - 单击底部文字可插入光标，拖动或 Shift+单击可选择文字
          - 支持方向键、Home、End、Ctrl+A 和 Ctrl+C
          - 底部产生光标或选区时，上方对比区自动跳转到对应行列
          - 所有底部条带共享横向滚动位置，适用于超长差异行
          - 已通过两份 10,000 行文本、同时显示 3 行差异的回归测试

          目标版本：Windows Beyond Compare 3.3.5 build 15075。

          安装包 SHA-256：`eb6cf8676ff79596ac797ed7587fdedd68c8645e75f7061c2dbbdb38aa8c8e7b`

          安装包未进行商业代码签名，Windows 可能显示 SmartScreen 提示。
          EOF
          gh release create v0.2.0 \
            "release-assets/BC3MultiDetails-Setup-0.2.0.exe#Windows 安装程序" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "BC3 MultiDetails v0.2.0" \
            --latest \
            --notes-file release-notes.md

      - name: Remove temporary release payload
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          asset_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/release-assets/BC3MultiDetails-Setup-0.2.0.exe?ref=main" --jq '.sha')"
          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/contents/release-assets/BC3MultiDetails-Setup-0.2.0.exe" \
            -f message='Remove temporary v0.2.0 release payload' \
            -f sha="${asset_sha}" \
            -f branch=main

      - name: Remove one-time workflow
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          workflow_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/publish-v0.2.0.yml?ref=main" --jq '.sha')"
          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/publish-v0.2.0.yml" \
            -f message='Remove one-time v0.2.0 publisher' \
            -f sha="${workflow_sha}" \
            -f branch=main
