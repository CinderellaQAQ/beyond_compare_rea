name: Publish BC3 MultiDetails v0.2.2

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'Publish v0.2.2 release'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release payload
        uses: actions/checkout@v4

      - name: Verify installer
        shell: bash
        run: |
          set -euo pipefail
          echo "395adf29bd5ad5e16496d38f26d186ad2d939f7f60c0de4d8193c9f10791fb67  release-assets/BC3MultiDetails-Setup-0.2.2.exe" |
            sha256sum --check --strict

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          修复原生多行 Text Details 在跨机器运行与上方当前行显示中的两个关键问题。

          - 修复第二条及后续所选行进入 BC3 原生样式回调时仍使用代理局部行号、导致 Delphi 原生断言与应用错误的问题
          - 修复多行代理活动期间原版单行同步把原始行号写入较短代理、导致 `item >= count` 断言的问题
          - 上方正文当前行改用 BC3 原生设置器，灰色当前行边框不再穿过文字
          - 延迟详情数据源重绑并保留原生模型锁，避免绘制与后台比较并发读取中间状态
          - 会话原地重载时刷新原始数据源与模型所有者，避免使用失效指针
          - 已通过两个各 10,000 行文件、三条不连续 10,000 字差异行、横向滚动位置 8,379、完整复制及 150% DPI 回归测试
          - 支持从正式 v0.2.0 或 v0.2.1 安全原地升级

          目标版本：Windows Beyond Compare 3.3.5 build 15075。

          安装包 SHA-256：`395adf29bd5ad5e16496d38f26d186ad2d939f7f60c0de4d8193c9f10791fb67`

          安装包未进行商业代码签名，Windows 可能显示 SmartScreen 提示。
          EOF
          gh release create v0.2.2 \
            "release-assets/BC3MultiDetails-Setup-0.2.2.exe#Windows 安装程序" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "BC3 MultiDetails v0.2.2" \
            --latest \
            --notes-file release-notes.md

      - name: Remove temporary release payload
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          asset_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/release-assets/BC3MultiDetails-Setup-0.2.2.exe?ref=main" --jq '.sha')"
          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/contents/release-assets/BC3MultiDetails-Setup-0.2.2.exe" \
            -f message='Remove temporary v0.2.2 release payload' \
            -f sha="${asset_sha}" \
            -f branch=main

      - name: Remove one-time workflow
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          workflow_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/publish-v0.2.2.yml?ref=main" --jq '.sha')"
          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/publish-v0.2.2.yml" \
            -f message='Remove one-time v0.2.2 publisher' \
            -f sha="${workflow_sha}" \
            -f branch=main
