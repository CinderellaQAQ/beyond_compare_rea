name: Publish BC3 MultiDetails v0.1.1

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'Publish v0.1.1 release'
    runs-on: ubuntu-latest
    steps:
      - name: Recover and verify installer
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER_BLOB: e4218c50ba3c80f7e5b891474a487eadb342e585
          INSTALLER_SHA256: b14940e8015d0955eeacbb661d8fdcec699265290e7f151adae62c44480dfdde
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${INSTALLER_BLOB}" --jq '.content' |
            tr -d '\n' | base64 --decode > BC3MultiDetails-Setup-0.1.1.exe
          echo "${INSTALLER_SHA256}  BC3MultiDetails-Setup-0.1.1.exe" | sha256sum --check --strict

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          修复底部 Text Details 在长差异行横向滚动后出现重复、错位或空白的问题。

          - 按原生渲染位移测量真实列宽
          - 显式同步左右详情编辑器
          - 修复分段位图复制越界
          - 保持 Ctrl 不连续多选与所有 L/R 条带共享横向滚动
          - 支持从本项目正式发布的 0.1.0 直接原地升级

          目标仍为 Windows Beyond Compare 3.3.5 build 15075。

          安装包 SHA-256：`b14940e8015d0955eeacbb661d8fdcec699265290e7f151adae62c44480dfdde`

          安装包未进行商业代码签名，Windows 可能显示 SmartScreen 提示。
          EOF
          gh release create v0.1.1             "BC3MultiDetails-Setup-0.1.1.exe#Windows 安装程序"             --target "${GITHUB_SHA}"             --title "BC3 MultiDetails v0.1.1"             --notes-file release-notes.md

      - name: Remove one-time workflow
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          workflow_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/publish-v0.1.1.yml?ref=main" --jq '.sha')"
          gh api --method DELETE             "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/publish-v0.1.1.yml"             -f message='Remove one-time v0.1.1 publisher'             -f sha="${workflow_sha}"             -f branch=main
